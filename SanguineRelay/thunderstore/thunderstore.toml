[config]
schemaVersion = "0.0.1"

[package]
namespace = "Shikaru"
name = "SanguineRelay"
versionNumber = "1.0.0"
description = "A dedicated-server Discord integration for V Rising."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_V_Rising = "1.733.2"

[build]
icon = "./icon.png"
readme = "../README.md"
outdir = "../artifacts/thunderstore"

[[build.copy]]
source = "../src/SanguineRelay/bin/Release/net6.0/SanguineRelay.dll"
target = "plugins/SanguineRelay/"

[[build.copy]]
source = "../src/SanguineRelay/bin/Release/net6.0/Discord.Net.Core.dll"
target = "plugins/SanguineRelay/"

[[build.copy]]
source = "../src/SanguineRelay/bin/Release/net6.0/Discord.Net.Rest.dll"
target = "plugins/SanguineRelay/"

[[build.copy]]
source = "../src/SanguineRelay/bin/Release/net6.0/Discord.Net.WebSocket.dll"
target = "plugins/SanguineRelay/"

[[build.copy]]
source = "../src/SanguineRelay/bin/Release/net6.0/Microsoft.Bcl.AsyncInterfaces.dll"
target = "plugins/SanguineRelay/"

[[build.copy]]
source = "../src/SanguineRelay/bin/Release/net6.0/Newtonsoft.Json.dll"
target = "plugins/SanguineRelay/"

[[build.copy]]
source = "../src/SanguineRelay/bin/Release/net6.0/System.Collections.Immutable.dll"
target = "plugins/SanguineRelay/"

[[build.copy]]
source = "../src/SanguineRelay/bin/Release/net6.0/System.Interactive.Async.dll"
target = "plugins/SanguineRelay/"

[[build.copy]]
source = "../src/SanguineRelay/bin/Release/net6.0/System.Linq.Async.dll"
target = "plugins/SanguineRelay/"

[[build.copy]]
source = "../CHANGELOG.md"
target = "./"

[[build.copy]]
source = "../COPYRIGHT"
target = "./"

[[build.copy]]
source = "../THIRD_PARTY_NOTICES.md"
target = "./"

[[build.copy]]
source = "../config-example.cfg"
target = "./"

[[build.copy]]
source = "../docs/GAME_HOOKS.md"
target = "docs/"

[publish]
repository = "https://thunderstore.io"
communities = ["v-rising"]
categories = ["server", "oakveil-update"]
