site_name: Bloodcraft Wiki
site_description: Community Bloodcraft documentation and BloodcraftExpansion content for V Rising
site_url: https://lastnahaj.github.io/V-Rising/

repo_name: lastnahaj/V-Rising
repo_url: https://github.com/lastnahaj/V-Rising

docs_dir: BloodcraftExpansion/docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  custom_dir: BloodcraftExpansion/overrides
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use light theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use dark theme
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.share
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

hooks:
  - BloodcraftExpansion/tools/mkdocs_hooks.py

extra_css:
  - stylesheets/gothic.css

